<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Vault | DGR VIP</title>
    <meta name="description" content="Music Vault — exclusive tracks by DGR VIP.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2300e699'/%3E%3Cpath d='M12 5v8.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V9h4V5h-6z' transform='translate(0 -2) scale(.95)' fill='%23031017'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #02080c;
            --glass: rgba(8, 22, 30, 0.62);
            --glass-hi: rgba(255, 255, 255, 0.06);
            --glass-line: rgba(255, 255, 255, 0.10);
            --line: rgba(255, 255, 255, 0.12);
            --emerald: #00e699;
            --cyan: #00b4d8;
            --text: #f0fdfa;
            --muted: rgba(220, 238, 245, 0.62);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        img { -webkit-user-drag: none; pointer-events: none; }

        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .topbar {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 16px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.3px;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--emerald), var(--cyan));
            display: grid;
            place-items: center;
        }

        .brand-mark svg { width: 17px; height: 17px; fill: #031017; }

        .admin-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 0.35rem 0.8rem;
            border: 1px solid var(--glass-line);
            border-radius: 50px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: color .2s, border-color .2s;
        }

        .admin-link:hover { color: var(--emerald); border-color: var(--emerald); }

        main {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 16px 2rem;
        }

        /* ---------- The player: compact, landscape, glass ---------- */
        .player {
            width: 100%;
            max-width: 700px;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02) 45%), var(--glass);
            backdrop-filter: blur(26px) saturate(160%);
            -webkit-backdrop-filter: blur(26px) saturate(160%);
            border: 1px solid var(--glass-line);
            border-radius: 18px;
            padding: 20px;
            /* --beat (0–1) is set from the audio analyser; the rim glows on each kick */
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 0 calc(10px + 40px * var(--beat, 0)) rgba(0, 230, 153, calc(0.06 + 0.22 * var(--beat, 0))),
                0 30px 70px rgba(0, 0, 0, 0.5);
            border-color: rgba(0, 230, 153, calc(0.10 + 0.35 * var(--beat, 0)));
        }

        .deck {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }

        .art {
            position: relative;
            width: 176px;
            height: 176px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(13, 42, 51, 0.8), rgba(7, 19, 25, 0.8));
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
        }

        .art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .art-placeholder {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
        }

        .art-placeholder svg { width: 40%; height: 40%; fill: rgba(0, 230, 153, 0.45); }

        .eq {
            position: absolute;
            left: 7px;
            bottom: 7px;
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 12px;
            padding: 4px 5px;
            box-sizing: content-box;
            background: rgba(2, 8, 12, 0.75);
            border-radius: 6px;
            opacity: 0;
            transition: opacity .3s;
        }

        .art.playing .eq { opacity: 1; }

        .eq span {
            width: 2px;
            background: var(--emerald);
            border-radius: 2px;
            animation: eq 0.9s ease-in-out infinite;
        }

        .eq span:nth-child(2) { animation-delay: -0.3s; }
        .eq span:nth-child(3) { animation-delay: -0.6s; }
        .eq span:nth-child(4) { animation-delay: -0.15s; }

        @keyframes eq {
            0%, 100% { height: 3px; }
            50% { height: 12px; }
        }

        .body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .meta {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .meta-text { min-width: 0; }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }

        .video-btn {
            flex-shrink: 0;
            display: none;
            align-items: center;
            gap: 0.3rem;
            padding: 0.28rem 0.6rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 71, 87, 0.45);
            background: rgba(255, 71, 87, 0.12);
            color: #ff8a9a;
            font: 600 0.72rem 'Outfit', sans-serif;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .video-btn:hover { background: #ff4757; color: #fff; }
        .video-btn.show { display: inline-flex; }

        /* Progress */
        .bar {
            position: relative;
            height: 16px;
            cursor: pointer;
            touch-action: none;
        }

        .bar-track {
            position: absolute;
            left: 0; right: 0;
            top: 50%;
            height: 4px;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-buffer, .bar-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0;
        }

        .bar-buffer { background: rgba(255, 255, 255, 0.14); }
        .bar-fill { background: linear-gradient(90deg, var(--emerald), var(--cyan)); }

        .bar-thumb {
            position: absolute;
            top: 50%;
            left: 0;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #fff;
            transform: translate(-50%, -50%) scale(0);
            transition: transform .15s;
            box-shadow: 0 0 10px rgba(0, 230, 153, 0.6);
        }

        .bar:hover .bar-thumb, .bar.dragging .bar-thumb { transform: translate(-50%, -50%) scale(1); }

        .times {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 0.76rem;
            font-variant-numeric: tabular-nums;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .ctrl {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: none;
            background: none;
            color: var(--muted);
            border-radius: 50%;
            cursor: pointer;
            transition: color .2s, background .2s;
            flex-shrink: 0;
        }

        .ctrl:hover { color: var(--text); background: var(--glass-hi); }
        .ctrl.on { color: var(--emerald); }
        .ctrl svg { width: 23px; height: 23px; fill: currentColor; }
        .ctrl.small svg { width: 19px; height: 19px; }

        .play {
            width: 54px;
            height: 54px;
            margin: 0 6px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: grid;
            place-items: center;
            color: #031017;
            background: linear-gradient(135deg, var(--emerald), var(--cyan));
            box-shadow: 0 4px 16px rgba(0, 230, 153, 0.35);
            transition: transform .15s;
            flex-shrink: 0;
        }

        .play:hover { transform: scale(1.06); }
        .play:active { transform: scale(0.96); }
        .play svg { width: 27px; height: 27px; fill: currentColor; }
        .play:disabled { opacity: .45; cursor: default; transform: none; }

        .volume {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 2px;
            min-width: 0;
        }

        .volume .ctrl svg { width: 17px; height: 17px; }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 96px;
            height: 4px;
            border-radius: 4px;
            background: linear-gradient(90deg, rgba(255,255,255,.7) var(--v, 80%), rgba(255,255,255,.14) var(--v, 80%));
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 11px; height: 11px;
            border-radius: 50%;
            background: #fff;
        }

        input[type=range]::-moz-range-thumb {
            width: 11px; height: 11px; border: none;
            border-radius: 50%;
            background: #fff;
        }

        /* Playlist */
        .list-head {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            color: var(--muted);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .list {
            list-style: none;
            margin-top: 4px;
            max-height: 230px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,.15) transparent;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s;
        }

        .row:hover { background: var(--glass-hi); }
        .row.active { background: rgba(0, 230, 153, 0.10); }

        .row-num {
            width: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .row.active .row-num { color: var(--emerald); }

        .row-thumb {
            width: 40px;
            height: 40px;
            border-radius: 7px;
            object-fit: cover;
            background: rgba(13, 42, 51, 0.8);
            flex-shrink: 0;
        }

        .row-text { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 8px; }

        .row-title {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row.active .row-title { color: var(--emerald); }
        .row-artist { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .empty, .loading {
            text-align: center;
            color: var(--muted);
            padding: 1rem 0.5rem;
            font-size: 0.85rem;
        }

        .error-note {
            display: none;
            margin-top: 0.5rem;
            font-size: 0.78rem;
            color: #fda4af;
            text-align: center;
        }

        footer {
            position: relative;
            z-index: 1;
            color: rgba(200, 220, 230, 0.35);
            font-size: 0.72rem;
            padding-bottom: 1.25rem;
        }

        /* Video modal */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: rgba(1, 6, 9, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal.open { display: flex; }

        .modal-box {
            width: 100%;
            max-width: 900px;
            background: rgba(10, 26, 34, 0.7);
            border: 1px solid var(--glass-line);
            border-radius: 16px;
            padding: 12px;
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .modal-close {
            background: var(--glass-hi);
            border: none;
            color: var(--text);
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
        }

        .video-frame {
            position: relative;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        button:focus-visible, a:focus-visible, .row:focus-visible, input:focus-visible, .bar:focus-visible {
            outline: 2px solid var(--emerald);
            outline-offset: 2px;
        }

        /* Browsers without backdrop blur get a denser tint so text stays readable */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .player { background: rgba(10, 26, 34, 0.85); }
        }

        @media (max-width: 640px) {
            .art { width: 128px; height: 128px; }
            .deck { gap: 14px; }
            .title { font-size: 1.15rem; }
            .player { padding: 14px; }
        }

        @media (max-width: 480px) {
            .art { width: 92px; height: 92px; }
            .deck { gap: 12px; }
            .title { font-size: 1.02rem; }
            .artist { font-size: 0.82rem; }
            .ctrl { width: 36px; height: 36px; }
            .play { width: 46px; height: 46px; }
            .volume { display: none; }      /* phones use hardware volume */
            .controls { justify-content: space-between; }
            .row-text { display: block; }
        }

        @media (prefers-reduced-motion: reduce) {
            .eq span { animation: none; height: 8px; }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            Music Vault
        </div>
        <a href="/admin" class="admin-link" aria-label="Admin studio">DGR</a>
    </header>

    <main>
        <section class="player" id="player" aria-label="Music player">
            <div class="deck">
                <div class="art" id="art">
                    <div class="art-placeholder" id="artPlaceholder">
                        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    </div>
                    <img id="artImg" alt="" hidden>
                    <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
                </div>

                <div class="body">
                    <div class="meta">
                        <div class="meta-text">
                            <div class="title" id="title">Loading…</div>
                            <div class="artist" id="artist">DGR VIP</div>
                        </div>
                        <button class="video-btn" id="videoBtn" type="button">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            Video
                        </button>
                    </div>

                    <div>
                        <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <div class="bar-track">
                                <div class="bar-buffer" id="barBuffer"></div>
                                <div class="bar-fill" id="barFill"></div>
                            </div>
                            <div class="bar-thumb" id="barThumb"></div>
                        </div>
                        <div class="times">
                            <span id="cur">0:00</span>
                            <span id="dur">0:00</span>
                        </div>
                    </div>

                    <div class="controls">
                        <button class="ctrl small" id="shuffleBtn" type="button" aria-label="Shuffle" aria-pressed="false">
                            <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                        </button>
                        <button class="ctrl" id="prevBtn" type="button" aria-label="Previous">
                            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                        </button>
                        <button class="play" id="playBtn" type="button" aria-label="Play" disabled>
                            <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="ctrl" id="nextBtn" type="button" aria-label="Next">
                            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                        <button class="ctrl small" id="repeatBtn" type="button" aria-label="Repeat" aria-pressed="false">
                            <svg viewBox="0 0 24 24" id="repeatIcon"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                        </button>
                        <div class="volume">
                            <button class="ctrl" id="muteBtn" type="button" aria-label="Mute">
                                <svg viewBox="0 0 24 24" id="volIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                            <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
                        </div>
                    </div>
                </div>
            </div>

            <div class="list-head">
                <span>Tracks</span>
                <span id="count"></span>
            </div>
            <ul class="list" id="list">
                <li class="loading">Loading tracks…</li>
            </ul>

            <div class="error-note" id="errorNote"></div>
        </section>
    </main>

    <footer>&copy; <span id="year"></span> DGR VIP &middot; Streaming only</footer>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Music video">
        <div class="modal-box">
            <div class="modal-head">
                <span id="modalTitle">Music Video</span>
                <button class="modal-close" id="modalClose" type="button" aria-label="Close video">✕</button>
            </div>
            <div class="video-frame" id="videoFrame"></div>
        </div>
    </div>

    <script>
        const PLAY = 'M8 5v14l11-7z';
        const PAUSE = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
        const NOTE = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230d2a33'/%3E%3Cpath d='M12 5v8.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V9h4V5h-6z' transform='translate(2.4 1.2) scale(.8)' fill='%2300e699' opacity='.6'/%3E%3C/svg%3E";

        const $ = (id) => document.getElementById(id);
        const audio = new Audio();          // never attached to the DOM: no native controls / "Save audio as"
        audio.preload = 'metadata';
        audio.controlsList = 'nodownload noplaybackrate';
        audio.disableRemotePlayback = true;

        let tracks = [];
        let index = -1;
        let shuffle = false;
        let repeat = 'off';                 // off | all | one
        let retried = false;

        // ---------- Beat detection (Web Audio) ----------
        // The stream is same-origin, so the analyser can read it. Created on the
        // first play (browsers only allow audio contexts after a user gesture).
        let actx, analyser, freq;
        const pulse = { level: 0, beat: 0, avg: 0, since: 1, fluxMean: 0, fluxVar: 0 };

        function ensureAnalyser() {
            if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            try {
                actx = new AC();
                analyser = actx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.35;
                analyser.minDecibels = -85;     // wider range so loud masters don't pin at the top
                analyser.maxDecibels = -10;
                actx.createMediaElementSource(audio).connect(analyser);
                analyser.connect(actx.destination);
                freq = new Uint8Array(analyser.frequencyBinCount);
            } catch (err) {
                console.warn('Beat sync unavailable', err);
                analyser = null;
            }
        }

        // Returns { level, beat }: level follows the bass (0–1); beat jumps to 1 on each kick and decays.
        // Beats are detected as sudden rises in bass energy (spectral flux) above an adaptive
        // threshold, which works even on loud, heavily mastered tracks.
        let prevBins = null;

        function readPulse(dt) {
            pulse.since += dt;
            pulse.beat *= Math.exp(-dt * 7);
            if (!analyser || audio.paused) {
                pulse.level *= Math.exp(-dt * 4);
                return pulse;
            }
            analyser.getByteFrequencyData(freq);
            const binHz = actx.sampleRate / analyser.fftSize;
            const lo = Math.max(1, Math.floor(35 / binHz)), hi = Math.ceil(150 / binHz), n = hi - lo + 1;
            if (!prevBins || prevBins.length !== n) prevBins = new Float32Array(n);

            let sum = 0, flux = 0;
            for (let i = 0; i < n; i++) {
                const v = freq[lo + i] / 255;
                sum += v;
                flux += Math.max(0, v - prevBins[i]);
                prevBins[i] = v;
            }
            const bass = sum / n;
            flux /= n;

            // Running mean/variance of the flux; a beat is a clear spike above it
            const a = Math.min(1, dt * 1.5);
            pulse.fluxMean += (flux - pulse.fluxMean) * a;
            pulse.fluxVar += ((flux - pulse.fluxMean) ** 2 - pulse.fluxVar) * a;
            if (flux > pulse.fluxMean + 1.5 * Math.sqrt(pulse.fluxVar) && flux > 0.015 && pulse.since > 0.26) {
                pulse.beat = 1;
                pulse.since = 0;
            }

            // Level = bass relative to its slow average, so quiet and loud songs both move
            pulse.avg += (bass - pulse.avg) * Math.min(1, dt * 0.5);
            const rel = Math.min(1, Math.max(0, bass - pulse.avg * 0.8) * 2.5);
            pulse.level += (rel - pulse.level) * Math.min(1, dt * 12);
            return pulse;
        }

        // ---------- Data ----------
        async function loadTracks() {
            try {
                const res = await fetch('/api/tracks', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const fresh = await res.json();
                // Keep the current position when refreshing expired stream links
                const currentId = tracks[index]?.id;
                tracks = fresh;
                index = currentId ? tracks.findIndex(t => t.id === currentId) : -1;
                renderList();
                if (index === -1 && tracks.length) select(0, false);
                $('playBtn').disabled = tracks.length === 0;
                if (!tracks.length) {
                    $('title').textContent = 'Coming soon';
                    $('artist').textContent = 'No tracks published yet';
                }
            } catch (err) {
                console.error(err);
                $('list').innerHTML = '<li class="empty">Could not load tracks. Please refresh.</li>';
                $('title').textContent = 'Offline';
            }
        }

        function renderList() {
            const list = $('list');
            list.innerHTML = '';
            $('count').textContent = tracks.length ? `${tracks.length} ${tracks.length === 1 ? 'song' : 'songs'}` : '';
            if (!tracks.length) {
                list.innerHTML = '<li class="empty">The vault is empty for now.</li>';
                return;
            }
            tracks.forEach((t, i) => {
                const li = document.createElement('li');
                li.className = 'row' + (i === index ? ' active' : '');
                li.tabIndex = 0;
                li.setAttribute('role', 'button');
                li.innerHTML = `
                    <span class="row-num">${i === index && !audio.paused ? '♪' : i + 1}</span>
                    <img class="row-thumb" alt="" src="${t.cover || NOTE}">
                    <div class="row-text">
                        <div class="row-title"></div>
                        <div class="row-artist"></div>
                    </div>`;
                li.querySelector('.row-title').textContent = t.title;
                li.querySelector('.row-artist').textContent = t.artist;
                li.addEventListener('click', () => (i === index ? toggle() : select(i, true)));
                li.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); li.click(); }
                });
                list.appendChild(li);
            });
        }

        // ---------- Playback ----------
        function select(i, autoplay) {
            if (!tracks[i]) return;
            index = i;
            retried = false;
            const t = tracks[i];
            audio.src = t.stream;
            $('title').textContent = t.title;
            $('artist').textContent = t.artist;
            $('errorNote').style.display = 'none';

            if (t.cover) {
                $('artImg').src = t.cover;
                $('artImg').hidden = false;
                $('artPlaceholder').hidden = true;
            } else {
                $('artImg').hidden = true;
                $('artPlaceholder').hidden = false;
            }
            $('videoBtn').classList.toggle('show', !!t.youtubeId);
            setProgress(0, 0);
            renderList();
            updateMediaSession();
            if (autoplay) play();
        }

        async function play() {
            if (index === -1 && tracks.length) select(0, false);
            ensureAnalyser();
            try {
                await audio.play();
            } catch (err) {
                if (err.name !== 'AbortError') console.warn(err);
            }
        }

        function toggle() {
            if (!tracks.length) return;
            audio.paused ? play() : audio.pause();
        }

        function pickNext(step) {
            if (!tracks.length) return -1;
            if (shuffle && tracks.length > 1) {
                let n;
                do { n = Math.floor(Math.random() * tracks.length); } while (n === index);
                return n;
            }
            return (index + step + tracks.length) % tracks.length;
        }

        function next() { select(pickNext(1), true); }

        function prev() {
            if (audio.currentTime > 3) { audio.currentTime = 0; return; }
            select(pickNext(-1), true);
        }

        audio.addEventListener('play', syncPlayState);
        audio.addEventListener('pause', syncPlayState);
        audio.addEventListener('ended', () => {
            if (repeat === 'one') { audio.currentTime = 0; play(); return; }
            const last = !shuffle && index === tracks.length - 1;
            if (last && repeat === 'off') { syncPlayState(); return; }
            next();
        });

        audio.addEventListener('error', async () => {
            if (index === -1 || !audio.src) return;
            // Stream links expire after a few hours; refresh once and resume
            if (!retried) {
                retried = true;
                const at = audio.currentTime;
                await loadTracks();
                if (tracks[index]) {
                    audio.src = tracks[index].stream;
                    audio.currentTime = at;
                    play();
                    return;
                }
            }
            $('errorNote').textContent = 'This track could not be played. Try another one or refresh.';
            $('errorNote').style.display = 'block';
        });

        function syncPlayState() {
            const playing = !audio.paused;
            $('playIcon').innerHTML = `<path d="${playing ? PAUSE : PLAY}"/>`;
            $('playBtn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
            $('art').classList.toggle('playing', playing);
            const num = document.querySelector('.row.active .row-num');
            if (num) num.textContent = playing ? '♪' : index + 1;
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
        }

        // ---------- Progress / seeking ----------
        const fmt = (s) => {
            if (!isFinite(s)) return '0:00';
            const m = Math.floor(s / 60), r = Math.floor(s % 60);
            return `${m}:${r < 10 ? '0' : ''}${r}`;
        };

        let dragging = false;

        function setProgress(cur, dur) {
            const pct = dur ? (cur / dur) * 100 : 0;
            $('barFill').style.width = pct + '%';
            $('barThumb').style.left = pct + '%';
            $('bar').setAttribute('aria-valuenow', Math.round(pct));
            $('cur').textContent = fmt(cur);
            $('dur').textContent = fmt(dur);
        }

        audio.addEventListener('timeupdate', () => {
            if (!dragging) setProgress(audio.currentTime, audio.duration);
        });
        audio.addEventListener('loadedmetadata', () => setProgress(audio.currentTime, audio.duration));
        audio.addEventListener('progress', () => {
            if (audio.duration && audio.buffered.length) {
                const end = audio.buffered.end(audio.buffered.length - 1);
                $('barBuffer').style.width = (end / audio.duration) * 100 + '%';
            }
        });

        function ratioFromEvent(e) {
            const rect = $('bar').getBoundingClientRect();
            return Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        }

        $('bar').addEventListener('pointerdown', (e) => {
            if (!audio.duration) return;
            dragging = true;
            $('bar').classList.add('dragging');
            $('bar').setPointerCapture(e.pointerId);
            setProgress(ratioFromEvent(e) * audio.duration, audio.duration);
        });
        $('bar').addEventListener('pointermove', (e) => {
            if (dragging) setProgress(ratioFromEvent(e) * audio.duration, audio.duration);
        });
        $('bar').addEventListener('pointerup', (e) => {
            if (!dragging) return;
            dragging = false;
            $('bar').classList.remove('dragging');
            audio.currentTime = ratioFromEvent(e) * audio.duration;
        });
        $('bar').addEventListener('keydown', (e) => {
            if (!audio.duration) return;
            if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
            if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
        });

        // ---------- Buttons ----------
        $('playBtn').addEventListener('click', toggle);
        $('nextBtn').addEventListener('click', next);
        $('prevBtn').addEventListener('click', prev);

        $('shuffleBtn').addEventListener('click', () => {
            shuffle = !shuffle;
            $('shuffleBtn').classList.toggle('on', shuffle);
            $('shuffleBtn').setAttribute('aria-pressed', shuffle);
        });

        $('repeatBtn').addEventListener('click', () => {
            repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
            $('repeatBtn').classList.toggle('on', repeat !== 'off');
            $('repeatBtn').setAttribute('aria-pressed', repeat !== 'off');
            $('repeatBtn').setAttribute('aria-label', 'Repeat: ' + repeat);
            $('repeatIcon').innerHTML = repeat === 'one'
                ? '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/>'
                : '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
        });

        const VOL_ON = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
        const VOL_OFF = '<path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>';

        function setVolume(v) {
            audio.volume = v;
            audio.muted = v === 0;
            $('vol').value = v;
            $('vol').style.setProperty('--v', v * 100 + '%');
            $('volIcon').innerHTML = v === 0 ? VOL_OFF : VOL_ON;
            try { localStorage.setItem('vault_volume', v); } catch {}
        }

        let lastVol = 0.8;
        $('vol').addEventListener('input', (e) => { lastVol = +e.target.value || lastVol; setVolume(+e.target.value); });
        $('muteBtn').addEventListener('click', () => setVolume(audio.volume > 0 && !audio.muted ? 0 : lastVol || 0.8));

        try {
            const saved = parseFloat(localStorage.getItem('vault_volume'));
            setVolume(isFinite(saved) ? saved : 0.8);
        } catch { setVolume(0.8); }

        // Keyboard: space toggles play when not typing
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); toggle(); }
            if (e.key === 'Escape') closeVideo();
        });

        // ---------- Video ----------
        function openVideo() {
            const t = tracks[index];
            if (!t?.youtubeId) return;
            audio.pause();
            $('modalTitle').textContent = t.title + ' — Music Video';
            $('videoFrame').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(t.youtubeId)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Music video"></iframe>`;
            $('modal').classList.add('open');
        }

        function closeVideo() {
            $('modal').classList.remove('open');
            $('videoFrame').innerHTML = '';
        }

        $('videoBtn').addEventListener('click', openVideo);
        $('modalClose').addEventListener('click', closeVideo);
        $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeVideo(); });

        // ---------- Lock screen / media keys ----------
        function updateMediaSession() {
            if (!('mediaSession' in navigator) || !tracks[index]) return;
            const t = tracks[index];
            navigator.mediaSession.metadata = new MediaMetadata({
                title: t.title,
                artist: t.artist,
                album: 'Music Vault',
                artwork: t.cover ? [{ src: new URL(t.cover, location.href).href, sizes: '512x512' }] : [],
            });
        }

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', play);
            navigator.mediaSession.setActionHandler('pause', () => audio.pause());
            navigator.mediaSession.setActionHandler('previoustrack', prev);
            navigator.mediaSession.setActionHandler('nexttrack', next);
        }

        // ---------- Deterrents (right-click / drag / save) ----------
        $('player').addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && ['s', 'u'].includes(e.key.toLowerCase())) e.preventDefault();
        });

        $('year').textContent = new Date().getFullYear();

        // ---------- Background: warp starfield ----------
        (function starfield() {
            const canvas = $('bgCanvas');
            const ctx = canvas.getContext('2d');
            const playerEl = $('player');
            const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const DEPTH = 1600;             // how far away new stars spawn
            const FOV = 320;                // perspective strength
            // Real star colours: mostly white, some blue-white, a few warm, a hint of brand teal
            const TINTS = [
                [255, 255, 255], [255, 255, 255], [214, 230, 255], [178, 206, 255],
                [255, 238, 214], [255, 214, 170], [160, 255, 222], [150, 225, 255],
            ];

            let w, h, cx, cy, dpr, stars = [], dust = [], nebula;
            let speed = 0, px = 0, py = 0, tx = 0, ty = 0, last = performance.now();

            // A pre-rendered soft glow per tint: bright core, coloured halo, falloff
            const sprites = TINTS.map(([r, g, b]) => {
                const c = document.createElement('canvas');
                c.width = c.height = 64;
                const g2 = c.getContext('2d');
                const grad = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.12, `rgba(${r},${g},${b},0.95)`);
                grad.addColorStop(0.3, `rgba(${r},${g},${b},0.35)`);
                grad.addColorStop(0.6, `rgba(${r},${g},${b},0.08)`);
                grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                g2.fillStyle = grad;
                g2.fillRect(0, 0, 64, 64);
                return c;
            });

            function spawn(s, anywhere) {
                s.x = (Math.random() - 0.5) * w * 3.2;
                s.y = (Math.random() - 0.5) * h * 3.2;
                s.z = anywhere ? Math.random() * DEPTH + 1 : DEPTH * (0.85 + Math.random() * 0.15);
                s.t = (Math.random() * TINTS.length) | 0;
                // Power curve: most stars small, a few big bright ones
                s.size = 0.7 + Math.pow(Math.random(), 3.2) * 3.6;
                s.tw = Math.random() * Math.PI * 2;          // twinkle phase
                s.tws = 1.5 + Math.random() * 3;             // twinkle speed
                return s;
            }

            function buildNebula() {
                // Faint colour clouds painted once, reused every frame
                nebula = document.createElement('canvas');
                nebula.width = w; nebula.height = h;
                const n = nebula.getContext('2d');
                n.fillStyle = '#02080c';
                n.fillRect(0, 0, w, h);
                const clouds = [
                    [0.18, 0.25, 0.55, 'rgba(0, 150, 120, 0.10)'],
                    [0.82, 0.75, 0.6, 'rgba(0, 110, 170, 0.12)'],
                    [0.55, 0.45, 0.45, 'rgba(60, 70, 160, 0.06)'],
                ];
                for (const [fx, fy, fr, col] of clouds) {
                    const r = Math.max(w, h) * fr;
                    const g = n.createRadialGradient(w * fx, h * fy, 0, w * fx, h * fy, r);
                    g.addColorStop(0, col);
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    n.fillStyle = g;
                    n.fillRect(0, 0, w, h);
                }
            }

            function resize() {
                dpr = Math.min(devicePixelRatio || 1, 2);
                w = innerWidth; h = innerHeight;
                canvas.width = w * dpr; canvas.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                cx = w / 2; cy = h / 2;
                const count = Math.round(Math.min(900, Math.max(260, (w * h) / 2200)));
                stars = Array.from({ length: count }, () => spawn({}, true));
                // Far-away static dust that only twinkles, for depth
                dust = Array.from({ length: Math.round(count * 0.6) }, () => ({
                    x: Math.random() * w, y: Math.random() * h,
                    a: 0.15 + Math.random() * 0.4, r: Math.random() * 0.8 + 0.2,
                    tw: Math.random() * 6.28,
                }));
                buildNebula();
            }
            addEventListener('resize', resize);
            resize();

            // Subtle parallax: the vanishing point drifts toward the pointer
            addEventListener('pointermove', (e) => {
                tx = (e.clientX / w - 0.5) * -60;
                ty = (e.clientY / h - 0.5) * -60;
            });

            function frame(now) {
                const dt = Math.min(0.05, (now - last) / 1000);
                last = now;
                const t = now / 1000;

                // Cruise slowly when paused; while playing, speed follows the bass and surges on each beat
                const p = readPulse(dt);
                const target = reduce ? 0 : audio.paused ? 70 : 80 + p.level * 520 + p.beat * 1100;
                speed += (target - speed) * Math.min(1, dt * (audio.paused ? 1.5 : 9));
                playerEl.style.setProperty('--beat', p.beat.toFixed(3));
                const flash = 1 + p.beat * 0.4;
                px += (tx - px) * dt * 2;
                py += (ty - py) * dt * 2;
                const vx = cx + px, vy = cy + py;

                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                ctx.drawImage(nebula, 0, 0, w, h);

                ctx.fillStyle = '#dfefff';
                for (const d of dust) {
                    ctx.globalAlpha = d.a * (0.6 + 0.4 * Math.sin(t * 1.3 + d.tw));
                    ctx.fillRect(d.x, d.y, d.r, d.r);
                }

                ctx.globalCompositeOperation = 'lighter';
                ctx.lineCap = 'round';
                const trail = speed * 0.09;  // how long streaks get at speed

                for (const s of stars) {
                    s.z -= speed * dt;
                    if (s.z < 2) { spawn(s, false); continue; }

                    const k = FOV / s.z;
                    const sx = s.x * k + vx;
                    const sy = s.y * k + vy;
                    if (sx < -60 || sx > w + 60 || sy < -60 || sy > h + 60) { spawn(s, false); continue; }

                    const near = 1 - s.z / DEPTH;                 // 0 far → 1 close
                    const fade = Math.min(1, near * 3);           // fade in from the distance
                    const twinkle = 0.78 + 0.22 * Math.sin(t * s.tws + s.tw);
                    const alpha = Math.min(1, fade * twinkle * flash);
                    const r = Math.min(10, s.size * (0.35 + near * near * 3.2) * (1 + p.beat * 0.25));

                    // Motion streak toward the vanishing point
                    if (trail > 2 && r > 0.6) {
                        const k2 = FOV / (s.z + trail * (1 + near * 4));
                        const ex = s.x * k2 + vx, ey = s.y * k2 + vy;
                        const [cr, cg, cb] = TINTS[s.t];
                        const lg = ctx.createLinearGradient(sx, sy, ex, ey);
                        lg.addColorStop(0, `rgba(${cr},${cg},${cb},${0.55 * alpha})`);
                        lg.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
                        ctx.globalAlpha = 1;
                        ctx.strokeStyle = lg;
                        ctx.lineWidth = Math.max(0.6, r * 0.55);
                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(ex, ey);
                        ctx.stroke();
                    }

                    // Glow sprite (halo is ~4x the core radius)
                    const g = r * 4.2;
                    ctx.globalAlpha = alpha;
                    ctx.drawImage(sprites[s.t], sx - g, sy - g, g * 2, g * 2);
                }

                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                if (!reduce) requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        })();

        loadTracks();
    </script>
</body>
</html>
